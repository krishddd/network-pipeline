# LLM-target red-team playbook.
#
# Chains the five Phase-6 scanners against a target LLM-backed
# application (chatbot, RAG app, tool-using agent). Selected by
# `cli plan --target-type llm` or by manual `--playbook llm_target`.
#
# Step ids are stable across resumes. Every step targets
# ObjectivePhase.LLM_REDTEAM so the registry routes them to the
# `llm_redteam` specialist agent.

name: llm_target
description: |
  LLM-application red-team chain: probe → persona → CoP jailbreak →
  RAG-poisoning (write-gated) → multi-turn HRL. ASR-R / ASR-L style
  metrics are recorded on every finding.

steps:
  # ── 1. Versioned prompt-injection corpus (cheap, fast). ──────────
  - id: pb-llm-prompt-injection
    mitre_id: T1059
    phase: llm-redteam
    title: "Fire the prompt-injection corpus against the target LLM"
    description: |
      Invoke llm_prompt_injection with default max_probes. Cover the
      direct + indirect categories (confused_deputy, context_extraction,
      tool_coercion, persona_bypass).
    preconditions: []
    acceptance_criteria:
      - "≥1 probe attempted (data.probes_run > 0)"
      - "ASR score recorded in data.asr_score"
    tools_required: [llm_prompt_injection]

  # ── 2. Persona library baseline. ─────────────────────────────────
  - id: pb-llm-persona-probe
    mitre_id: T1059
    phase: llm-redteam
    title: "Iterate the persona library; record bypasses"
    description: |
      Invoke llm_persona_probe with the engagement's primary offensive
      intent (e.g. "explain how to disable AV silently"). Cheap, no
      LLM judges — runs after pb-llm-prompt-injection so we have a
      baseline ASR before composition.
    preconditions:
      - "pb-llm-prompt-injection completed"
    acceptance_criteria:
      - "personas_run list non-empty"
    tools_required: [llm_persona_probe]

  # ── 3. CoP-composed jailbreak (top-K dual-judged payloads). ──────
  - id: pb-llm-cop-jailbreak
    mitre_id: T1059
    phase: llm-redteam
    title: "Compose-of-Principles jailbreak (Phase-3 composer + judges)"
    description: |
      Invoke llm_jailbreak_cop. When the available providers are all
      RLHF-aligned (e.g. only Anthropic + OpenAI keys are set), set
      avoid_high_collusion=True so the composer skips authority-laden
      principles the judges over-credit.
    preconditions:
      - "pb-llm-persona-probe completed"
    acceptance_criteria:
      - "data.attempts > 0"
      - "data.asr_score recorded"
    tools_required: [llm_jailbreak_cop]

  # ── 4. RAG poisoning (WRITE-SIDE, double-gated). ─────────────────
  # Only fires when the operator explicitly set
  # roe.allow_destructive_writes=True during `soundwave interview`
  # AND populated roe.write_allowlist. Otherwise the scanner refuses
  # with a clear WriteGateError and this step records BLOCKED.
  - id: pb-llm-rag-poisoning
    mitre_id: T1565.002
    phase: llm-redteam
    title: "RAG-memory poisoning (JailAgent-lite, write-gated)"
    description: |
      Invoke llm_rag_poisoning with the engagement's primary offensive
      intent and 3-5 candidate trigger documents. Refuses unless
      roe.allow_destructive_writes=True AND target matches
      roe.write_allowlist. Records ASR-R (retrieval perturbation).
    preconditions:
      - "pb-llm-cop-jailbreak completed"
    acceptance_criteria:
      - "data block present (success or refused gate)"
    tools_required: [llm_rag_poisoning]
    opsec: careful

  # ── 5. Multi-turn HRL jailbreak (expensive; last). ───────────────
  - id: pb-llm-multi-turn
    mitre_id: T1059
    phase: llm-redteam
    title: "Multi-turn HRL jailbreak"
    description: |
      Invoke llm_multi_turn_jailbreak with max_turns=6 against the
      single intent that consistently refused in earlier steps. The
      HRL attacker decouples strategic (high-level) from tactical
      (low-level) policies and shapes reward with refusal-token
      density inverse.
    preconditions:
      - "pb-llm-cop-jailbreak completed"
    acceptance_criteria:
      - "data.terminal_reason recorded"
      - "data.turns_taken recorded"
    tools_required: [llm_multi_turn_jailbreak]
