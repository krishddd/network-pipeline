name: mitre_credential_access
description: |
  ATT&CK Credential Access (TA0006) emulation, scoped to the network /
  web pipeline. Focus on token theft and credential reuse — never
  brute force.

steps:
  - id: pb-ca-jwt-harvest
    mitre_id: T1528
    phase: post-exploit
    title: "Capture JWT / session tokens via auth_replay"
    description: |
      Inspect every authenticated response for Set-Cookie + Authorization
      headers. Record JWT bearer tokens as credential nodes typed=jwt;
      session cookies as credential nodes typed=session.
    preconditions:
      - "endpoint"
    acceptance_criteria:
      - "≥1 credential node added (type ∈ {jwt, session})"
    tool_hint: "auth_replay"
    opsec_max: standard

  - id: pb-ca-jwt-attack
    mitre_id: T1212
    phase: initial-access
    title: "Forge JWT via alg=none / weak HMAC"
    description: |
      Run jwt_tool against captured JWTs: alg=none, kid path traversal,
      weak HMAC dictionary, alg confusion (RS→HS). Record any forgeable
      token as a HIGH severity finding with two verified methods.
    preconditions:
      - "credential where type=jwt"
    acceptance_criteria:
      - "jwt_tool ran against ≥1 captured JWT"
      - "Any forgable token recorded with confidence=verified"
    tool_hint: "jwt_tool"
    opsec_max: careful
    priority_bump: 1

  - id: pb-ca-cookie-reuse
    mitre_id: T1550.004
    phase: post-exploit
    title: "Session-cookie reuse across endpoints"
    description: |
      With the captured session cookie, walk discovered endpoints to
      confirm session validity and surface privilege boundaries.
    preconditions:
      - "credential where type=session"
      - "endpoint"
    acceptance_criteria:
      - "≥3 endpoints probed with the captured session"
      - "Privileged endpoints documented with response status histogram"
    tool_hint: "auth_replay"
    opsec_max: standard
    priority_bump: 2
