id: EXPOSED-GIT-REPO
title: Exposed .git directory — source code disclosure
severity: high
http_request:
  method: GET
  path: /.git/HEAD
  body: ""
expected_response:
  status: 200
  body_contains: "ref: refs/heads/"
cvss: 7.5
cwe:
  - CWE-538
mitre:
  - T1083
references:
  - https://owasp.org/www-project-web-security-testing-guide/stable/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
remediation: Block access to .git via web server config (nginx deny /.git).
